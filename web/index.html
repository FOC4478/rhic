<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RHIC Church App.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RHIC">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>RHIC</title>

  <link rel="manifest" href="manifest.json">
</head>

<body>

  <!-- PDF.js -->
  <script type="module">
    import * as pdfjsLib from
      'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs';

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.mjs';

    globalThis.pdfjsLib = pdfjsLib;

    globalThis.pdfRenderOptions = {
      cMapUrl:
        'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/cmaps/',
      cMapPacked: true,
      standardFontDataUrl:
        'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/standard_fonts/'
    };

    /*
     * Make the PDF.js standard font path available globally.
     * pdfx uses this configuration when rendering on Web.
     */
    globalThis.standardFontDataUrl =
      'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/standard_fonts/';
  </script>

  <script src="flutter_bootstrap.js" async></script>

</body>
</html>
